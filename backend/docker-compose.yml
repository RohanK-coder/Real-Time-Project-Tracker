# Local development dependencies. Run the backend with ./mvnw spring-boot:run.
# For the full production-like stack (2 backend replicas + nginx + frontend) see ../deploy/.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    ports:
      - "5434:5432"
    volumes:
      - tracker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  tracker-pgdata:
