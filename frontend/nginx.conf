# Serves the SPA and reverse-proxies /api and /ws to the backend replicas, so the browser sees a
# single origin (no CORS, cookies-free bearer auth). Docker's DNS returns every replica of the
# `backend` service; the resolver directive re-resolves it so scaling up/down is picked up.
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    zone backend 64k;
    least_conn;
    # A replica that dies stops answering (no TCP reset), so without a short proxy_connect_timeout
    # (below) nginx waits the default 60s. max_fails=3 avoids ejecting *both* replicas over a single
    # transient error (e.g. during a rolling restart when DNS still lists old container IPs).
    server backend:8080 resolve max_fails=3 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend;
        # Fail over within ~2s. A connect failure means the request was never sent, so retrying it on
        # another replica is safe even for POST/PUT; responses from a replica are never retried.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location = /ws {
        proxy_pass http://backend;
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # STOMP heartbeats every 10s keep the socket well inside this timeout.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
